# FLUXLINE — textes du jeu (français, langue de référence).
#
# Format : « clé = valeur », UTF-8, une ligne par texte. Échappements : \n, \uXXXX.
# Paramètres nommés entre accolades : {n}, {score}… (ne pas les traduire).
# Pluriels : clé.one / clé.few / clé.many / clé.other (selon la langue).
# Les nombres sont mis en forme par le jeu (séparateurs ci-dessous).

lang.name = Français
