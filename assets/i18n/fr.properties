# Défi du jour
challenge.counted.title = Pièces comptées
challenge.counted.desc = Le distributeur ne contient que quelques pièces de plus que l'objectif.
challenge.rush.title = Contre la montre
challenge.rush.desc = Un compte à rebours bref et un fluide rapide.
challenge.network.title = Grand réseau
challenge.network.desc = Un objectif très long, avec du temps pour le construire.
challenge.drain.title = Rejoindre l'arrivée
challenge.drain.desc = Seule l'arrivée termine la manche avec succès.

# Campagne
level.1.title = Premier flux
level.1.hint = Posez des tuyaux devant la source avant que le plasma ne s'élance.
level.2.title = Le contournement
level.2.hint = Un mur barre la route : prenez le virage à temps.
level.3.title = Croisées
level.3.hint = Traversez une croix dans les deux sens : +500 points.
level.4.title = Le réservoir
level.4.hint = Le réservoir se remplit lentement : profitez du répit.
level.5.title = Sens unique
level.5.hint = Les flèches ne laissent passer le plasma que dans un sens.
level.6.title = Destination
level.6.hint = Ici, seule l'arrivée compte : la manche ne réussit qu'en l'atteignant.
level.7.title = Les piliers
level.7.hint = Des piliers entourent la source. Gardez de l'espace devant vous.
level.8.title = Les cloisons
level.8.hint = Des cloisons en quinconce. Chaque pièce doit compter.
level.9.title = Double croix
level.9.hint = Quatre croix et un réservoir : le score s'envole.
level.10.title = Retour à l'envoyeur
level.10.hint = L'arrivée touche la source, mais s'ouvre de l'autre côté.
level.11.title = Le damier
level.11.hint = Un champ de plots : les virages sont partout.
level.12.title = Contre-courant
level.12.hint = Quatre sens uniques dispersés. Lisez-les avant de construire.
level.13.title = L'usine
level.13.hint = Des machines dans les coins, deux réservoirs au centre.
level.14.title = Bonus en chaîne
level.14.hint = Une colonne de croix : un réseau qui se recoupe paie gros.
level.15.title = Point de chute
level.15.hint = L'arrivée est tout en haut, derrière les cloisons.
level.16.title = Les écluses
level.16.hint = Réservoirs et sens uniques alternent le long des bords.
level.17.title = La grille
level.17.hint = Des murs en quinconce. Planifiez deux pièces à l'avance.
level.18.title = Pression
level.18.hint = Peu de temps, un fluide rapide. Pas de place pour l'hésitation.
level.19.title = Le grand détour
level.19.hint = L'arrivée est à deux pas — mais il faut d'abord faire le tour.
level.20.title = Réacteur
level.20.hint = Tout à la fois : croix, réservoir, sens uniques et arrivée.
