# 每日挑战
challenge.counted.title = 限量管件
challenge.counted.desc = 供料器里的管件只比目标多几个。
challenge.rush.title = 争分夺秒
challenge.rush.desc = 倒计时很短，流速很快。
challenge.network.title = 庞大管网
challenge.network.desc = 目标很长，但有时间慢慢搭建。
challenge.drain.title = 抵达出口
challenge.drain.desc = 只有到达出口才算成功完成本回合。

# 关卡
level.1.title = 初次流动
level.1.hint = 在等离子喷涌而出之前，在源头前方铺好管道。
level.2.title = 绕行
level.2.hint = 一堵墙挡住了去路：及时转弯。
level.3.title = 十字路口
level.3.hint = 从两个方向穿过十字管：+500 分。
level.4.title = 储液罐
level.4.hint = 储液罐灌满得很慢：趁机喘口气。
level.5.title = 单行道
level.5.hint = 箭头只允许等离子朝一个方向通过。
level.6.title = 目的地
level.6.hint = 这里只有出口才重要：到达出口才算成功。
level.7.title = 立柱
level.7.hint = 立柱环绕着源头。在前方留出空间。
level.8.title = 隔板
level.8.hint = 交错排列的隔板。每个管件都要物尽其用。
level.9.title = 双十字
level.9.hint = 四个十字管加一个储液罐：分数飙升。
level.10.title = 原路返回
level.10.hint = 出口紧挨着源头，但开口在另一侧。
level.11.title = 棋盘
level.11.hint = 遍地都是桩子：处处都要转弯。
level.12.title = 逆流
level.12.hint = 四个分散的单向管。先看清方向再搭建。
level.13.title = 工厂
level.13.hint = 角落里是机器，中间有两个储液罐。
level.14.title = 连锁奖励
level.14.hint = 一列十字管：自我交叉的管网收益丰厚。
level.15.title = 落点
level.15.hint = 出口在最上方，隔板后面。
level.16.title = 船闸
level.16.hint = 储液罐和单向管沿着边缘交替排列。
level.17.title = 网格
level.17.hint = 交错的墙壁。提前规划两步。
level.18.title = 高压
level.18.hint = 时间紧，流速快。容不得犹豫。
level.19.title = 大迂回
level.19.hint = 出口近在咫尺，但得先绕一大圈。
level.20.title = 反应堆
level.20.hint = 应有尽有：十字管、储液罐、单向管和出口。
