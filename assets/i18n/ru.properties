# Кампания
level.1.title = Первый поток
level.1.hint = Проложите трубы перед источником, пока плазма не вырвалась наружу.
level.2.title = Обход
level.2.hint = Путь преграждает стена: поверните вовремя.
level.3.title = Перекрёстки
level.3.hint = Пройдите крестовину в обоих направлениях: +500 очков.
level.4.title = Резервуар
level.4.hint = Резервуар наполняется медленно: воспользуйтесь передышкой.
level.5.title = В одну сторону
level.5.hint = Стрелки пропускают плазму только в одном направлении.
level.6.title = Пункт назначения
level.6.hint = Здесь важен только сток: раунд засчитывается, лишь если до него дойти.
level.7.title = Колонны
level.7.hint = Источник окружён колоннами. Оставляйте себе место впереди.
level.8.title = Перегородки
level.8.hint = Перегородки в шахматном порядке. Каждая деталь на счету.
level.9.title = Двойной крест
level.9.hint = Четыре крестовины и резервуар: счёт взлетает.
level.10.title = Возврат отправителю
level.10.hint = Сток примыкает к источнику, но открывается с другой стороны.
level.11.title = Шахматная доска
level.11.hint = Поле из столбиков: повороты на каждом шагу.
level.12.title = Против течения
level.12.hint = Четыре разбросанные односторонние трубы. Изучите их, прежде чем строить.
level.13.title = Завод
level.13.hint = Машины по углам, два резервуара в центре.
level.14.title = Цепной бонус
level.14.hint = Колонна крестовин: сеть, пересекающая сама себя, приносит много очков.
level.15.title = Точка сброса
level.15.hint = Сток на самом верху, за перегородками.
level.16.title = Шлюзы
level.16.hint = Вдоль краёв чередуются резервуары и односторонние трубы.
level.17.title = Решётка
level.17.hint = Стены в шахматном порядке. Планируйте на две детали вперёд.
level.18.title = Давление
level.18.hint = Мало времени, быстрый поток. Колебаться некогда.
level.19.title = Большой крюк
level.19.hint = Сток совсем рядом — но сначала придётся сделать круг.
level.20.title = Реактор
level.20.hint = Всё сразу: крестовины, резервуар, односторонние трубы и сток.
