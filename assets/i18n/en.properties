# Credits
credits.title = CREDITS
credits.tagline = A game of pipes and plasma, in the tradition of the arcade puzzlers of the late 1980s.
credits.design = DESIGN, PROGRAMMING
credits.design.text = All graphics and sounds are generated by code (the project's tools/ folder): no borrowed assets.
credits.fonts = FONTS
credits.engine = ENGINE
credits.scoring = SCORING
credits.scoring.text = Pipe +{pipe} (+{over} beyond the goal) · reservoir +{reservoir} · crossover +{cross} · drain +{drain} · replacement −{replace} · unused piece −{unused} · fast flow: ×{fast}.

# Daily challenge
challenge.counted.title = Counted pieces
challenge.counted.desc = The dispenser holds only a few more pieces than the goal.
challenge.rush.title = Against the clock
challenge.rush.desc = A short countdown and a fast flow.
challenge.network.title = Grand network
challenge.network.desc = A very long goal, with time to build it.
challenge.drain.title = Reach the drain
challenge.drain.desc = Only reaching the drain wins the round.

# Campaign
level.1.title = First flow
level.1.hint = Lay pipes in front of the source before the plasma surges out.
level.2.title = The detour
level.2.hint = A wall blocks the way: take the turn in time.
level.3.title = Crossroads
level.3.hint = Send the plasma through a cross piece both ways: +500 points.
level.4.title = The reservoir
level.4.hint = The reservoir fills slowly: enjoy the breather.
level.5.title = One way
level.5.hint = Arrows let the plasma through in one direction only.
level.6.title = Destination
level.6.hint = Here only the drain counts: the round is won only by reaching it.
level.7.title = The pillars
level.7.hint = Pillars surround the source. Keep room ahead of you.
level.8.title = The partitions
level.8.hint = Staggered partitions. Every piece has to count.
level.9.title = Double cross
level.9.hint = Four crosses and a reservoir: the score takes off.
level.10.title = Return to sender
level.10.hint = The drain touches the source, but opens on the other side.
level.11.title = The checkerboard
level.11.hint = A field of studs: there are turns everywhere.
level.12.title = Against the current
level.12.hint = Four scattered one-way pipes. Read them before you build.
level.13.title = The factory
level.13.hint = Machines in the corners, two reservoirs in the middle.
level.14.title = Chain bonus
level.14.hint = A column of crosses: a network that crosses itself pays big.
level.15.title = Drop point
level.15.hint = The drain is at the very top, behind the partitions.
level.16.title = The locks
level.16.hint = Reservoirs and one-way pipes alternate along the edges.
level.17.title = The grid
level.17.hint = Staggered walls. Plan two pieces ahead.
level.18.title = Pressure
level.18.hint = Little time, a fast flow. No room for hesitation.
level.19.title = The long way round
level.19.hint = The drain is a stone's throw away — but first you have to go all the way around.
level.20.title = Reactor
level.20.hint = Everything at once: crosses, reservoir, one-way pipes and drain.
